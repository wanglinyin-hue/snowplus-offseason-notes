<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SnowPlus 雙板與單板雪季前準備手冊入口。">
  <meta name="theme-color" content="#343b4f">
  <title>SnowPlus｜雪季前準備手冊</title>
  <style>
    :root {
      color-scheme: light;
      --midnight: #343b4f;
      --shadow: #383533;
      --frost: #8ea1aa;
      --aspen: #a5b4b8;
      --stone: #e0e0db;
      --snow: #f6f7f7;
      --white: #ffffff;
      --content: 1120px;
    }

    * { box-sizing: border-box; }

    html { background: var(--snow); }

    body {
      margin: 0;
      color: var(--shadow);
      background: var(--snow);
      font-family: "Noto Sans TC", "Source Han Sans TC", "PingFang TC", sans-serif;
      letter-spacing: 0;
    }

    a { color: inherit; }

    .topbar {
      min-height: 112px;
      background: var(--midnight);
    }

    .topbar__inner {
      width: min(var(--content), calc(100% - 48px));
      min-height: 112px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      width: 106px;
      height: auto;
      display: block;
    }

    .section-label {
      margin: 0;
      color: var(--stone);
      font: 600 12px/1.4 "Helvetica Neue", Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

    main {
      width: min(var(--content), calc(100% - 48px));
      margin: 0 auto;
      padding: 72px 0 80px;
    }

    .intro {
      max-width: 720px;
      margin-bottom: 40px;
    }

    h1 {
      margin: 0 0 18px;
      color: var(--shadow);
      font-family: "GenWanMin TW", "Source Han Serif TC", "Noto Serif TC", serif;
      font-size: clamp(36px, 5vw, 58px);
      font-weight: 600;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .intro p {
      margin: 0;
      color: #596064;
      font-size: 18px;
      line-height: 1.8;
    }

    .manual-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .manual-card {
      display: grid;
      grid-template-columns: minmax(150px, 0.82fr) minmax(0, 1.18fr);
      min-height: 380px;
      overflow: hidden;
      border: 1px solid #d2d6d4;
      border-radius: 6px;
      background: var(--white);
    }

    .manual-card__cover {
      min-height: 380px;
      background: var(--stone);
      overflow: hidden;
    }

    .manual-card__cover img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .manual-card--snowboard .manual-card__cover img {
      transform: scale(1.85);
      transform-origin: 50% 74%;
    }

    .manual-card__body {
      min-width: 0;
      padding: 36px 30px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .manual-card__type {
      margin: 0 0 18px;
      color: #6f7e84;
      font: 600 12px/1.4 "Helvetica Neue", Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    h2 {
      margin: 0 0 14px;
      color: var(--shadow);
      font-family: "GenWanMin TW", "Source Han Serif TC", "Noto Serif TC", serif;
      font-size: 34px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .manual-card__body p {
      margin: 0 0 28px;
      color: #62686b;
      font-size: 15px;
      line-height: 1.75;
    }

    .manual-link {
      width: 100%;
      min-height: 52px;
      margin-top: auto;
      padding: 14px 16px;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--white);
      background: var(--midnight);
      border: 1px solid var(--midnight);
      border-radius: 4px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 160ms ease, color 160ms ease;
    }

    .manual-link:hover,
    .manual-link:focus-visible {
      color: var(--midnight);
      background: var(--white);
      outline: none;
    }

    .manual-link__arrow {
      font-family: Arial, sans-serif;
      font-size: 20px;
      line-height: 1;
    }

    .note-band {
      margin-top: 28px;
      padding: 24px 0;
      border-top: 1px solid #d4d8d6;
      border-bottom: 1px solid #d4d8d6;
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 24px;
    }

    .note-band h2 {
      margin: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .note-band p {
      margin: 0;
      color: #62686b;
      font-size: 14px;
      line-height: 1.75;
    }

    footer {
      background: var(--stone);
    }

    .footer__inner {
      width: min(var(--content), calc(100% - 48px));
      margin: 0 auto;
      padding: 28px 0;
      color: #62686b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      font-size: 12px;
      line-height: 1.5;
    }

    .footer__inner strong { color: var(--shadow); }

    @media (max-width: 900px) {
      .manual-grid { grid-template-columns: 1fr; }
      .manual-card { min-height: 330px; }
      .manual-card__cover { min-height: 330px; }
    }

    @media (max-width: 560px) {
      .topbar,
      .topbar__inner { min-height: 92px; }

      .topbar__inner,
      main,
      .footer__inner { width: min(100% - 32px, var(--content)); }

      .logo { width: 88px; }
      .section-label { font-size: 10px; }
      main { padding: 48px 0 56px; }
      .intro { margin-bottom: 30px; }
      h1 { font-size: 38px; }
      .intro p { font-size: 16px; line-height: 1.7; }

      .manual-card {
        grid-template-columns: 118px minmax(0, 1fr);
        min-height: 322px;
      }

      .manual-card__cover { min-height: 322px; }
      .manual-card__cover img { object-position: center top; }
      .manual-card__body { padding: 26px 20px; }
      .manual-card__type { margin-bottom: 12px; font-size: 10px; }
      h2 { font-size: 27px; }
      .manual-card__body p { font-size: 14px; margin-bottom: 22px; }
      .manual-link { padding: 13px 14px; font-size: 14px; }

      .note-band {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .footer__inner {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .manual-link { transition: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <img class="logo" src="assets/snowplus-logo-white.png" alt="SnowPlus Winter Sports">
      <p class="section-label">Off-Season Notes</p>
    </div>
  </header>

  <main>
    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title">選擇你的<br>雪季前準備手冊</h1>
      <p>依照你使用的板別開始。不用一次看完，先從現在最需要的方向慢慢準備。</p>
    </section>

    <section class="manual-grid" aria-label="選擇雙板或單板手冊">
      <article class="manual-card">
        <div class="manual-card__cover">
          <img src="assets/ski-open-cute-cover.png" alt="SnowPlus 雙板雪季前準備手冊可愛版封面">
        </div>
        <div class="manual-card__body">
          <p class="manual-card__type">Ski Edition</p>
          <h2>雙板手冊</h2>
          <p>從活動度、穩定到力量控制，為下一次上雪找回熟悉的節奏。</p>
          <a class="manual-link" href="https://wanglinyin-hue.github.io/snowplus-ski-preseason-2026/open-cute/?utm_source=snowplus_manual_library&amp;utm_medium=referral&amp;utm_campaign=2627_preseason_manuals&amp;utm_content=ski_open_cute">
            <span>開啟雙板學員版</span>
            <span class="manual-link__arrow" aria-hidden="true">↗</span>
          </a>
        </div>
      </article>

      <article class="manual-card manual-card--snowboard">
        <div class="manual-card__cover">
          <img src="assets/snowboard-open-cute-cover.jpg" alt="SnowPlus 單板雪季前準備手冊可愛版封面">
        </div>
        <div class="manual-card__body">
          <p class="manual-card__type">Snowboard Edition</p>
          <h2>單板手冊</h2>
          <p>從落地、旋轉到單腳控制，讓非雪季的練習更有方向。</p>
          <a class="manual-link" href="https://wanglinyin-hue.github.io/snowplus-sb-preseason-2026/open-cute/?utm_source=snowplus_manual_library&amp;utm_medium=referral&amp;utm_campaign=2627_preseason_manuals&amp;utm_content=snowboard_open_cute">
            <span>開啟單板學員版</span>
            <span class="manual-link__arrow" aria-hidden="true">↗</span>
          </a>
        </div>
      </article>
    </section>

    <aside class="note-band" aria-labelledby="safety-note">
      <h2 id="safety-note">Safety Note</h2>
      <p>本手冊為一般性的雪季前準備資源，不是醫療診斷或個別治療建議。如有明顯疼痛、近期受傷或手術，請先諮詢醫療或物理治療專業人員。</p>
    </aside>
  </main>

  <footer>
    <div class="footer__inner">
      <strong>SnowPlus 正式註冊的中文滑雪學校</strong>
      <span>服務於二世谷、留壽都、喜樂樂</span>
    </div>
  </footer>
</body>
</html>
